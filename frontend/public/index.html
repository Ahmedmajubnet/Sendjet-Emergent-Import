<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#FF6B00" />
        <meta name="description" content="SendJet connects senders with people already traveling by plane, car, train or bus. Browse journeys and parcel requests, review profiles, and connect on routes that already exist." />
        <meta name="keywords" content="peer to peer parcel delivery, send packages worldwide, traveler carrier, luggage sharing, international shipping, escrow delivery" />
        <link rel="canonical" href="https://sendjet.de/" />

        <!-- Open Graph -->
        <meta property="og:site_name" content="SendJet" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="SendJet · Send parcels with people already going your way" />
        <meta property="og:description" content="A marketplace connecting senders with people already traveling by plane, car, train or bus. Browse routes and connect with people going your way." />
        <meta property="og:url" content="https://sendjet.de/" />
        <meta property="og:image" content="https://sendjet.de/og-default.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:locale" content="en" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="SendJet · Send parcels with people already going your way" />
        <meta name="twitter:description" content="Find people already traveling your route by plane, car, train or bus. Browse without an account and connect when you are ready." />
        <meta name="twitter:image" content="https://sendjet.de/og-default.png" />

        <!-- PWA -->
        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
        <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="SendJet" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="application-name" content="SendJet" />
        <meta name="msapplication-TileColor" content="#FF6B00" />
        <meta name="msapplication-TileImage" content="/icons/icon-192.png" />

        <!-- Non-blocking Google Fonts: preconnect + media="print" swap trick.
             If Google Fonts is unreachable (blocked in some regions like China/Iran),
             page still renders instantly using the system font fallback in App.css. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" />
        </noscript>
        <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
        <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
        <title>SendJet · Send parcels with people already going your way</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

      This HTML file is a template.

      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    </body>
</html>
